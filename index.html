<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(135deg,#ff9ad5,#ffd1e8);
font-family:Arial;
overflow:hidden;
text-align:center;
}

h1{
color:white;
font-size:50px;
text-shadow:0 0 15px hotpink;
animation:zoom 1.5s infinite alternate;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.1);}
}

img{
width:250px;
border-radius:20px;
box-shadow:0 0 25px rgba(255,255,255,0.6);
margin-top:20px;
}

button{
margin-top:20px;
padding:15px 30px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
background:white;
color:#ff4d88;
box-shadow:0 0 15px pink;
}

.heart{
position:absolute;
color:#ff2d75;
animation:fly linear infinite;
}

@keyframes fly{
0%{transform:translateY(110vh);opacity:0;}
20%{opacity:1;}
100%{transform:translateY(-120vh);opacity:0;}
}
</style>
</head>

<body>

<h1>💖 Hà Châu xinh gái 💖</h1>

<img src="image.jpg" alt="ảnh">

<button onclick="document.getElementById('music').play()">
▶ Bật nhạc
</button>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>
// tim bay
for(let i=0;i<80;i++){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="💗";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(3+Math.random()*5)+"s";
heart.style.fontSize=(15+Math.random()*30)+"px";
document.body.appendChild(heart);
}
</script>

</body>
</html>
