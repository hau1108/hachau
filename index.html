<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(135deg,#ff9ad5,#ffd1e8);
font-family:Arial,sans-serif;
overflow:hidden;
text-align:center;
}

h1{
color:white;
font-size:50px;
text-shadow:0 0 15px hotpink;
animation:zoom 1.5s infinite alternate;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.1);}
}

img{
width:250px;
border-radius:20px;
box-shadow:0 0 25px rgba(255,255,255,0.6);
margin-top:20px;
}

.heart{
position:absolute;
color:#ff2d75;
animation:fly linear infinite;
pointer-events:none;
}

@keyframes fly{
0%{transform:translateY(110vh);opacity:0;}
20%{opacity:1;}
100%{transform:translateY(-120vh);opacity:0;}
}
</style>
</head>

<body>

<h1>💖 Hà Châu xinh gái 💖</h1>

<img src="image.jpg" alt="Ảnh">

<!-- Video chỉ dùng để phát âm thanh -->
<video id="music" autoplay loop playsinline style="display:none;">
    <source src="video.mp4" type="video/mp4">
</video>

<script>
// Tim bay
for(let i=0;i<80;i++){
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="💗";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(3+Math.random()*5)+"s";
    heart.style.fontSize=(15+Math.random()*30)+"px";
    document.body.appendChild(heart);
}

// Tự phát nhạc
const music=document.getElementById("music");

window.onload=()=>{
    music.play().catch(()=>{
        document.body.addEventListener("click",()=>{
            music.play();
        },{once:true});
    });
};
</script>

</body>
</html>
